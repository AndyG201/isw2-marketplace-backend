name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace_test
      SPRING_DATASOURCE_USERNAME: marketplace_test
      SPRING_DATASOURCE_PASSWORD: marketplace_test_local
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: marketplace_test
          POSTGRES_PASSWORD: marketplace_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_test -d marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Cache Maven Wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Prepare Maven Wrapper (with retries)
        run: |
          chmod +x mvnw
          for intento in 1 2 3; do
            ./mvnw -B -q --version && exit 0
            echo "No se pudo descargar Maven (intento $intento de 3)"
            sleep 15
          done
          exit 1

      - name: Build, test and generate coverage
        run: ./mvnw -B clean verify

      - name: Verify JaCoCo report
        run: test -s target/site/jacoco/jacoco.xml

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.projectKey=AndyG201_isw2-marketplace-backend
          -Dsonar.organization=andyg201
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore