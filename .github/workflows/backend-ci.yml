
name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/marketplace_test
      SPRING_DATASOURCE_USERNAME: marketplace_test
      SPRING_DATASOURCE_PASSWORD: marketplace_test_local
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: marketplace_test
          POSTGRES_PASSWORD: marketplace_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_test -d marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Give execution permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and execute tests
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
