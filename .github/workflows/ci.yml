
name: CI - Marketplace Backend

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'test/**'
      - 'feature/**'
      - 'qa/**'

  pull_request:
    branches:
      - main
      - 'integration/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y medir cobertura
    runs-on: windows-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Ejecutar pruebas y generar cobertura
        run: .\mvnw.cmd -B clean verify

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-marketplace
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
