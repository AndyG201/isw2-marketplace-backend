# A2. Configuracion sin credenciales para SPRING_PROFILES_ACTIVE=docker.
# application.yaml mantiene la importacion de las sondas de A1.
spring:
  application:
    name: marketplace
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:host.docker.internal}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

jwt.secret: ${JWT_SECRET}
seguridad.documento.clave-cifrado: ${DOCUMENTO_CLAVE_CIFRADO}
seguridad.documento.clave-hmac: ${DOCUMENTO_CLAVE_HMAC}

app:
  storage:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    cloudinary-url: ${CLOUDINARY_URL:}
  reportes:
    directorio: ${REPORTES_DIR:/app/reportes}
  auditoria:
    b2:
      enabled: ${B2_ENABLED:false}
      endpoint: ${B2_ENDPOINT:}
      region: ${B2_REGION:}
      bucket: ${B2_BUCKET:}
      access-key: ${B2_ACCESS_KEY:}
      secret-key: ${B2_SECRET_KEY:}
      path-style-access: ${B2_PATH_STYLE_ACCESS:true}
      retention-days: ${B2_RETENTION_DAYS:365}
