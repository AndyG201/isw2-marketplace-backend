# A1: unicamente salud HTTP; sin configuracion, credenciales ni metricas publicas.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Las sondas se usan tambien fuera de Kubernetes.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
# SMTP se procesa asincronamente; no se abre conexion SMTP en cada heartbeat.
management.health.mail.enabled=false

# Reiniciar solo por fallo del proceso, no por la caida de PostgreSQL o Redis.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never

# Un proceso vivo aun puede no estar listo para atender solicitudes.
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
